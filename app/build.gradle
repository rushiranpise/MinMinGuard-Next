plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.fatminmin.xposed.minminguard.next'

    signingConfigs {
        release {
            keyAlias System.getenv("KEY_ALIAS") ?: 'minminguard'
            keyPassword System.getenv("KEYSTORE_PASS")
            storeFile file(System.getenv("KEYSTORE_FILE") ?: 'minminguard.keystore')
            storePassword System.getenv("KEY_PASS")
        }
        debug {
            storeFile file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    compileSdk 37

    defaultConfig {
        applicationId "tw.fatminmin.xposed.minminguard.next"
        minSdk 21
        targetSdk 36
        versionCode 72
        versionName "3.0.0"
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            /* Sign with the real release key when the signing secrets are present
               (set in CI); otherwise produce an unsigned APK that CI signs with
               uber-apk-signer, matching the historical flow. */
            if (System.getenv("KEYSTORE_PASS") != null && System.getenv("KEY_PASS") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        disable 'MissingTranslation', 'QueryAllPackagesPermission'
    }
}

dependencies {
    // Xposed API (API level 93 / LSPosed-compatible). Vendored as a jar because the
    // api.lsposed.org maven is unreliable; the real implementation is provided by
    // LSPosed / Vector / Xposed at runtime. compileOnly only - the API classes must
    // NEVER be bundled into the module APK or they would shadow the framework's own.
    compileOnly files('libs/api-93.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.apl-devs:appintro:v4.2.3'
    implementation 'de.greenrobot:greendao:2.0.0'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}

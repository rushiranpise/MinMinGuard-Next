name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build MinMinGuard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execution permission
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Sign release APK
        run: |
          mkdir -p /tmp/mmg
          wget -nv "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -O /tmp/mmg/uber-apk-signer.jar
          java -jar /tmp/mmg/uber-apk-signer.jar --apks ./app/build/outputs/apk/release/app-release-unsigned.apk --out /tmp/mmg/
          mv /tmp/mmg/app-release-aligned-debugSigned.apk /tmp/mmg/app-release.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minminguard-build
          path: |
            ./app/build/outputs/apk/debug/app-debug.apk
            /tmp/mmg/app-release.apk

      - name: Publish GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./app/build/outputs/apk/debug/app-debug.apk
            /tmp/mmg/app-release.apk
